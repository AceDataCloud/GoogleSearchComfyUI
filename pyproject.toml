[project]
name = "google-search"
version = "0.1.1"
description = "Google Search Dify-parity tools through Ace Data Cloud for ComfyUI"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["requests>=2.31,<3", "jsonschema>=4,<5"]
classifiers = ["Operating System :: OS Independent"]

[project.urls]
Repository = "https://github.com/AceDataCloud/GoogleSearchComfyUI"
Documentation = "https://github.com/AceDataCloud/GoogleSearchComfyUI#readme"
"Bug Tracker" = "https://github.com/AceDataCloud/GoogleSearchComfyUI/issues"

[tool.comfy]
PublisherId = "acedatacloud"
DisplayName = "Google Search by Ace Data Cloud"
Icon = "https://raw.githubusercontent.com/AceDataCloud/GoogleSearchComfyUI/main/assets/logo-400.png"
